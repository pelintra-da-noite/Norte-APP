:root{--h:212;--dl:0;--o:hsl(var(--h) 100% calc(56% + var(--dl)*1%));--o2:hsl(var(--h) 100% calc(78% + var(--dl)*.5%));--b1:hsl(var(--h) 100% calc(62% + var(--dl)*1%));--b2:hsl(var(--h) 100% calc(44% + var(--dl)*1%));--ob:hsl(var(--h) 100% 94%);--od:hsl(var(--h) 90% 20%);--ok:hsl(var(--h) 90% 5%);--gl:hsl(var(--h) 100% calc(56% + var(--dl)*1%)/.5);--gl2:hsl(var(--h) 100% calc(56% + var(--dl)*1%)/.75);--gl3:hsl(var(--h) 100% calc(50% + var(--dl)*1%)/.3);--t:#fff;--m:rgba(255,255,255,.55);--c:rgba(255,255,255,.07);--b:rgba(255,255,255,.12);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#000;background-repeat:no-repeat;background-attachment:fixed;color:var(--t);font:16px/1.4 "Identidad","Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#m{padding:20px 18px 110px;max-width:520px;margin:0 auto}
h1{font-size:34px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.02em}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--m);margin:0 0 10px;font-weight:600}
.sub{color:rgba(255,255,255,.7);margin:0 0 18px;font-size:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:30px;padding:18px;margin-bottom:14px;}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06) 45%,rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.6);border-left-color:rgba(255,255,255,.42);box-shadow:0 0 26px var(--gl3),0 18px 40px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.5),inset 0 -14px 26px rgba(255,255,255,.05)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
input,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--b);border-radius:14px;color:#fff;padding:12px 14px;font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--o)}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.btn{background:linear-gradient(135deg,var(--b1),var(--b2));border-radius:14px;padding:12px 18px;font-weight:600}
.btn.g{background:var(--c);border:1px solid var(--b)}
.ic{background:rgba(255,255,255,.08);border-radius:12px;width:40px;height:40px;flex:none;font-size:18px}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--b)}
.it:first-of-type{border-top:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:none;flex:none;font-size:14px;line-height:1}
.ck.on{background:var(--o);border-color:var(--o)}
.done{text-decoration:line-through;color:var(--m)}
.x{background:none;color:var(--m);font-size:20px;padding:4px 8px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b2),var(--o2));border-radius:8px;transition:width .4s}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em}
.chips{display:flex;gap:8px;justify-content:center;margin:14px 0}
.chip{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:8px 16px;font-size:14px}.chip.on{background:var(--o);border-color:var(--o)}
.orbw{position:relative;width:240px;height:240px;margin:14px auto}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,var(--ob),var(--b1) 38%,var(--od) 74%,var(--ok));box-shadow:0 0 80px var(--gl)}
.orb.run{animation:p 4s ease-in-out infinite}.orb.brk{filter:hue-rotate(var(--bk,-60deg)) saturate(.7)}
@keyframes p{50%{transform:scale(1.06)}}
.tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 12px rgba(0,0,0,.5)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,#000 60%,transparent)}
nav div{display:flex;gap:4px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.6);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.5);border-radius:26px;padding:6px;width:100%;max-width:490px}
nav button{flex:1;background:none;color:var(--m);padding:8px 0;border-radius:999px;font-size:10px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff}
.ov{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
#toast{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));background:rgba(10,24,54,.7);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:14px;display:none;z-index:9;text-align:center}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15)}.dots i.on{background:var(--o)}


.pill{background:#000;color:#fff;border-radius:40px;padding:17px 22px;font-weight:600;width:100%;font-size:16px}
.tile{position:relative;overflow:hidden;border-radius:38px;padding:20px 18px;margin-bottom:12px;color:#fff;background:radial-gradient(circle at 28% 0%,var(--c1),transparent 66%),radial-gradient(circle at 70% 112%,var(--c2),transparent 62%),rgba(8,14,28,.55);border:1.5px solid var(--c3);box-shadow:0 0 30px var(--c4),inset 0 0 34px rgba(255,255,255,.07);cursor:pointer}

function vFoco(){

 ${T.run||T.left!==T.len?"":`<div class="chips">${[15,25,45,60].map(n=>`<button class="chip ${S.set.work===n?"on":""}" data-a="tlen" data-i="${n}">${n} min</button>`).join("")}</div>`}

function vObj(){

 ${L.map(g=>{const ex=gexp(g),dn=!!g.fin,d=g.steps.filter(x=>x.d).length,p=g.steps.length?Math.round(d/g.steps.length*100):0,dl=g.due?Math.ceil((new Date(g.due)-new Date(dk()))/864e5):null;

function act(a,i,j){
 const id=Number(i);if(((a==="nav"&&i!==view)||a==="goday")&&busy()){confirmLeave(()=>{cancelSess();act(a,i,j)});return}anim=["nav","goday","name","prio","nclose","rep"].includes(a);
 switch(a){

 case"name":if(!val("#in"))return;S.name=val("#in");askScr();break;
 case"prio":if(!val("#in"))return;S.prio={date:dk(),text:val("#in"),done:false};break;
 case"pdone":S.prio.done=!S.prio.done;break;
 case"tadd":if(!val("#in"))return;S.tasks.push({id:Date.now(),t:val("#in"),done:false});break;
 case"ttog":{const t=S.tasks.find(x=>x.id===id);t.done=!t.done;t.dd=t.done?dk():null;break}
 case"tdel":S.tasks=S.tasks.filter(x=>x.id!==id);break;
 case"hadd":if(!val("#in"))return;S.habits.push({id:Date.now(),n:val("#in"),days:[]});break;
 case"htog":{const h=S.habits.find(x=>x.id===id),k=h.days.indexOf(dk());k>=0?h.days.splice(k,1):h.days.push(dk());break}
 case"hdel":if(!confirm("Apagar este hábito?"))return;S.habits=S.habits.filter(x=>x.id!==id);break;
 case"gadd":if(!val("#in"))return;S.goals.push({id:Date.now(),t:val("#in"),due:PK.date,steps:[]});PK.date="";break;
 case"gdel":if(!confirm("Apagar este objetivo?"))return;S.goals=S.goals.filter(x=>x.id!==id);break;
 case"sadd":{const v=val("#s"+id);if(!v)return;S.goals.find(x=>x.id===id).steps.push({t:v,d:false});break}
 case"stog":{const g=S.goals.find(x=>x.id===id),s=g.steps[Number(j)];s.d=!s.d;if(g.steps.every(z=>z.d))g.fin=dk();else delete g.fin;break}
 case"mood":{const d=j||dk();S.diary[d]=Object.assign(S.diary[d]||{},{m:id});break}
 case"sel":sd=i;break;
 case"mprev":cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);break;
 case"mnext":cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);break;

 case"wc":cp=id;break;
 case"wg":S.wgoal=Math.max(1,Math.min(7,S.wgoal+Number(i)));break;
 case"wadd":{const m=parseInt(val("#wm"));if(!m)return;S.work.push({id:Date.now(),d:dk(),t:tsel,m});break}
 case"wdel":S.work=S.work.filter(x=>x.id!==id);break;
 case"wstart":PRE=true;break;
 case"wpre0":PRE=false;break;

 case"wstop":G.on=false;lock(false);break;
 case"wskip":if(G.ph==="w")G.sk=(G.sk||0)+1;gnext();return;
 case"mp":M.sel=id;break;
 case"mm":M.min=id;break;
 case"mv":M.voz=!M.voz;break;
 case"mu":M.mus=!M.mus;break;
 case"mstart":mstart();break;
 case"mstop":mstop();break;
 case"hp":hp=(hp+1)%3;break;
 case"profile":openProfile();return
 case"ptime":pick("time",PK.time,v=>{PK.time=v;render()});return
 case"pdate":pick("date",PK.date,v=>{PK.date=v;render()});return
 case"rep":rp=1;view="rel";loadApps();break;
 case"rnext":rp=Math.min(rp+1,repLines().length);setTimeout(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"}),60);break;

 case"nclose":{const o=S.first;if(!okF()){toast("Preenche todos os campos para continuar.");return}if(!o.f)o.date=dk();o.f=1;toast("Sessão guardada. Podes voltar a ela quando quiseres.");view="hoje";break}
 case"eadd":{const a=val("#sa"),m=parseInt(val("#sm"));if(!a||!m)return;const t=S.screen[dk()]=S.screen[dk()]||{};t[a]=(t[a]||0)+m;break}

 case"treset":T.run=false;T.left=T.len=(T.mode==="work"?S.set.work:S.set.brk)*60;T.dist=0;lock(false);break;
 case"tskip":{if(T.mode==="work"){if(pz()>=3){toast("Já usaste as 3 pausas de hoje.");return}S.pz={d:dk(),n:pz()+1}}T.run=false;lock(false);swap();break}
 }

function swap(){T.mode=T.mode==="work"?"brk":"work";T.len=T.left=(T.mode==="work"?S.set.work:S.set.brk)*60;T.dist=0}

const TABS=["hoje","foco","habitos","obj","dia"];let sx=0,sy=0,sOK=false;
